<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz Día de los Carritos 🏎️💜</title>
<style>
:root{--bg1:#2a0a4d;--bg2:#5b21b6;--bg3:#7c3aed;--ink:#fff;--accent:#facc15;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 0%,var(--bg3),var(--bg2) 45%,var(--bg1) 100%);background-color:#2a0a4d}
#stars,#cars,#tulips{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.5s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
#cars{z-index:2}#tulips{z-index:1}
.car{position:absolute;left:0;width:clamp(80px,26vw,120px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.car svg{display:block;width:100%;height:auto}
main{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:clamp(8px,2vh,20px);padding:16px;text-align:center;overflow-y:auto}
h1{margin:0;font-size:clamp(22px,6.2vw,40px);line-height:1.1;text-shadow:0 0 18px #c084fc,0 3px 0 #3b0764}
h1 small{display:block;font-size:.55em;color:var(--accent);margin-top:6px}
#hero{width:min(74vw,300px);background:none;border:0;padding:0;cursor:pointer;animation:bob 2.2s infinite ease-in-out;filter:drop-shadow(0 0 22px rgba(250,204,21,.55))}
#hero svg{width:100%;height:auto;display:block}
#hero.go{animation:rev .5s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes rev{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-1deg)}40%{transform:translateX(6px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#hint{font-size:16px;opacity:.9;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.4}}
#note{display:none;max-width:min(88vw,380px);padding:18px 22px;border-radius:22px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
#note.show{display:block;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
#note b{display:block;font-size:clamp(24px,7vw,34px);color:var(--accent);text-shadow:0 2px 0 #3b0764}
#note span{display:block;margin-top:6px;font-size:16px}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:scale(1);opacity:1}}
#btns{display:none;gap:14px;align-items:flex-start;justify-content:center}
#btns.show{display:flex}
#btn,#btn2{display:block;width:min(40vw,150px);background:none;border:0;padding:0;cursor:pointer;animation:bob 1.2s infinite ease-in-out;transition:opacity .4s}
#btn2{animation-delay:.4s}
#btn2.away{opacity:0;pointer-events:none}
.lbl{display:block;font-size:14px;margin-top:2px;color:#fde68a}
#btn svg,#btn2 svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 14px rgba(192,132,252,.9))}
.tulip{position:absolute;bottom:-6px;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,1.4,.4,1) backwards,sway 3.2s ease-in-out 1.3s infinite alternate}
.tulip svg{display:block;width:100%;height:auto}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.heart{position:absolute;bottom:-30px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media (max-height:680px){h1{font-size:clamp(20px,6vw,32px)}#hero{width:min(58vw,210px)}#note{padding:12px 16px}#note b{font-size:24px}#note span{font-size:14px}#btn,#btn2{width:min(34vw,120px)}}
#rollwrap{display:none;position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:4;justify-content:center;pointer-events:none}
#rollwrap.show{display:flex;animation:drivein 1.1s cubic-bezier(.2,.9,.3,1)}
#roll{pointer-events:auto;width:min(42vw,170px);background:none;border:0;padding:0;cursor:pointer;transition:opacity .4s;filter:drop-shadow(0 0 14px rgba(249,115,22,.7))}
#roll svg{display:block;width:100%;height:auto}
#roll.away{opacity:0;pointer-events:none}
@keyframes drivein{from{transform:translateX(-110vw)}to{transform:translateX(0)}}
h1{width:100%;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="stars"></div>
<div id="tulips"></div>
<div id="cars"></div>
<main>
  <h1>¡Feliz Día de los Carritos Hot Wheels!<small>mi Tolochito 💜</small></h1>
  <button id="hero" aria-label="Toca el Camaro"></button>
  <div id="hint">👆 Toca el Camaro</div>
  <div id="note"><b>Te amo 3 millones 💜</b><span>Eres mi carrito favorito de toda la colección 🏎️</span></div>
  <div id="btns"><button id="btn" aria-label="Toca el carrito"><span id="btnCar"></span><span class="lbl">¡Toca el carrito!</span></button></div>
  <div id="rollwrap"><button id="roll" aria-label="Toca el Camaro para que ruede"><span id="rollCar"></span><span class="lbl">¡Tócame! 🌷</span></button></div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var BODY={
 camaro:"M6 44 L6 33 Q7 29 12 28.5 L26 27.5 L40 16 L82 15 L100 28 L124 30 Q134 32 135 38 L135 44Z",
 bmw:"M6 44 L6 34 Q6 30 11 29.5 L30 28 L42 17 L88 16 L102 27.5 L126 30 Q134 32 135 38 L135 44Z",
 ferrari:"M5 44 L5 36 Q6 32 12 31 L34 29 L58 17 L80 16.5 L96 26 L122 30 Q134 32 136 38 L136 44Z"
};
var TAIL='<rect x="5" y="33" width="4" height="4" rx="1" fill="#ef4444"/>';
var DET={
 camaro:'<path d="M42 19 L80 18.5 L93 27 L31 27Z" fill="url(#gw)"/><path d="M61.5 18.7 L62 27" stroke="#1f1235" stroke-width="1.6"/><path d="M4 27 H16 V29 H4Z" fill="#111"/><path d="M8 29 V32 M13 29 V31" stroke="#111" stroke-width="1.5"/>'+TAIL+'<path d="M124 31.5 L133.5 34 L133.5 37 L124 36Z" fill="#fff8b0"/>',
 bmw:'<path d="M45 19.5 L62 19.2 L62 27.5 L35 27.5Z M66 19.2 L86 19 L96 27.5 L66 27.5Z" fill="url(#gw)"/>'+TAIL+'<path d="M125 32 L133.5 34.5 L133.5 37 L125 36.5Z" fill="#fff8b0"/><rect x="130" y="38" width="3.6" height="4.5" rx="1.4" fill="#0b0b12"/><circle cx="72" cy="35" r="3.2" fill="#fff" stroke="#111" stroke-width=".6"/><path d="M72 35 L72 31.8 A3.2 3.2 0 0 1 75.2 35Z M72 35 L72 38.2 A3.2 3.2 0 0 1 68.8 35Z" fill="#2563eb"/>',
 ferrari:'<path d="M60 19.5 L78 19 L90 26.5 L50 27Z" fill="url(#gw)"/><path d="M84 33 L100 32 L100 38 L86 38Z" fill="#0b0b12" opacity=".8"/><circle cx="70" cy="34" r="2.3" fill="#facc15" stroke="#111" stroke-width=".6"/><path d="M3 32 H12 V34 H3Z" fill="#111"/>'+TAIL+'<path d="M122 31.6 L134 34.5 L134 36.5 L122 35.5Z" fill="#fff8b0"/>'
};
var DEFS='<defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient><linearGradient id="gw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>';
function wheel(x){
 return '<circle cx="'+x+'" cy="44" r="11.5" fill="#0b0b12"/><circle cx="'+x+'" cy="44" r="9" fill="#17171f"/><g class="wh"><circle cx="'+x+'" cy="44" r="5.8" fill="#e5e7eb"/><path d="M'+(x-5.8)+' 44H'+(x+5.8)+'M'+x+' 38.2V49.8M'+(x-4.1)+' 39.9L'+(x+4.1)+' 48.1M'+(x-4.1)+' 48.1L'+(x+4.1)+' 39.9" stroke="#6b7280" stroke-width="1.3"/></g><circle cx="'+x+'" cy="44" r="1.8" fill="#374151"/>';
}
// todos los carros miran a la DERECHA (frente = derecha)
function car(t,c,extra){
 return '<svg viewBox="0 0 150 56">'+DEFS+'<ellipse cx="70" cy="53" rx="62" ry="3" fill="rgba(0,0,0,.35)"/>'
 +'<path d="M134 34 L150 29 L150 43Z" fill="#fff8b0" opacity=".22"/>'
 +'<path d="'+BODY[t]+'" fill="'+c+'"/><path d="'+BODY[t]+'" fill="url(#gl)"/>'+(extra||'')
 +'<path d="M8 38.5 L130 38.5" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>'
 +DET[t]+wheel(32)+wheel(108)+'</svg>';
}
// estrellas
(function(){var s=$('stars'),h='';for(var i=0;i<45;i++){h+='<i class="star" style="left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;animation-delay:'+Math.random()*2.5+'s"></i>'}s.innerHTML=h})();
// héroe y botón
var stripe='<path d="M46 41 C56 33 66 39 78 34 C72 40 78 41 66 42.5 C58 43.5 52 43 46 41Z" fill="#f97316"/><path d="M52 41 C60 36 68 40 76 37 C72 40 70 41.5 64 42Z" fill="#fde047"/>';
$('hero').innerHTML=car('camaro','#facc15',stripe);
$('btnCar').innerHTML=car('ferrari','#ef4444');
$('rollCar').innerHTML=car('camaro','#f97316',stripe);
// carros que pasan
var lanes=[4,12,20,78,86,93],timer=null;
function drive(){
 var names=['camaro','bmw','ferrari'],t=names[Math.floor(Math.random()*3)],c=COL[Math.floor(Math.random()*COL.length)];
 var d=Math.random()<.5?1:-1,el=document.createElement('div');
 el.className='car';el.style.top=lanes[Math.floor(Math.random()*lanes.length)]+'%';
 el.innerHTML=car(t,c);$('cars').appendChild(el);
 var w=window.innerWidth,a=d>0?-160:w+40,b=d>0?w+40:-160;
 el.animate([{transform:'translateX('+a+'px) scaleX('+d+')'},{transform:'translateX('+b+'px) scaleX('+d+')'}],{duration:3200+Math.random()*2800,easing:'linear'}).onfinish=function(){el.remove()};
}
function start(){if(timer)return;drive();timer=setInterval(drive,1300)}
// tulipanes
var TC=[['#7e22ce','#a855f7'],['#6d28d9','#8b5cf6'],['#9333ea','#c084fc'],['#581c87','#9333ea']];
function tulip(x){
 var ts=document.querySelectorAll('.tulip');if(ts.length>70)ts[0].remove();
 var c=TC[Math.floor(Math.random()*TC.length)],el=document.createElement('div'),w=42+Math.random()*30;
 el.className='tulip';el.style.left=(x==null?(Math.random()*94)+'%':x+'px');el.style.width=w+'px';
 el.style.animationDelay=(x==null?Math.random()*.9:0)+'s,'+(Math.random()*2)+'s';
 el.innerHTML='<svg viewBox="0 0 40 90"><path d="M20 40 V90" stroke="#3fa35b" stroke-width="3"/><path d="M20 82 C6 76 6 60 12 54 C16 64 20 70 20 82Z" fill="#3fa35b"/><path d="M20 78 C34 72 34 58 28 52 C24 62 20 68 20 78Z" fill="#2f8a4a"/><path d="M8 18 C8 32 14 42 20 42 C26 42 32 32 32 18 L26 24 L20 12 L14 24Z" fill="'+c[0]+'"/><path d="M14 24 L20 12 L26 24 C26 34 23 42 20 42 C17 42 14 34 14 24Z" fill="'+c[1]+'"/></svg>';
 $('tulips').appendChild(el);
}
function hearts(){
 for(var i=0;i<14;i++){var h=document.createElement('div');h.className='heart';h.textContent=Math.random()<.5?'💜':'🌷';
  h.style.left=Math.random()*95+'%';h.style.fontSize=(16+Math.random()*18)+'px';h.style.animationDuration=(3+Math.random()*3)+'s';h.style.animationDelay=Math.random()*1.2+'s';
  $('tulips').appendChild(h);(function(x){setTimeout(function(){x.remove()},7500)})(h)}
}
// interacción
var opened=false,flowers=0;
$('hero').onclick=function(){
 this.classList.remove('go');void this.offsetWidth;this.classList.add('go');
 if(opened)return;opened=true;
 $('hint').style.display='none';$('note').classList.add('show');start();
 setTimeout(function(){$('btns').classList.add('show')},2500);
 setTimeout(function(){$('rollwrap').classList.add('show')},1200);
};
$('roll').onclick=function(){
 var b=this,r=b.getBoundingClientRect(),W=window.innerWidth,D=2800,el=document.createElement('div');
 b.classList.add('away');
 el.className='car';el.style.top=r.top+'px';el.style.width=r.width+'px';
 el.innerHTML=car('camaro','#f97316',stripe);$('cars').appendChild(el);
 el.animate([{transform:'translateX('+r.left+'px)'},{transform:'translateX('+(W+40)+'px)'}],{duration:D,easing:'ease-in'}).onfinish=function(){el.remove();setTimeout(function(){b.classList.remove('away')},400)};
 var n=Math.max(9,Math.round(W/34));
 for(var i=0;i<n;i++){(function(k){
  var x=r.left+(W-r.left)*(k/n)+Math.random()*10;
  var f=(x-r.left)/(W+40-r.left);
  setTimeout(function(){tulip(x)},D*Math.sqrt(f));
 })(i)}
 hearts();
};
$('btn').onclick=function(){
 for(var i=0;i<12&&flowers<48;i++,flowers++)tulip();
 hearts();for(var k=0;k<5;k++)setTimeout(drive,k*250);
};
</script>
</body>
</html>
